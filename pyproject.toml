[project]
name = "structlog-journald"
description = "Structlog processor to send logs to journald"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nguyễn Hồng Quân", email = "ng.hong.quan@gmail.com" }]
keywords = ["journald", "logging", "structlog", "systemd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "journald-send>=0.3.0",
    "structlog >= 25.1.0",
]
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/hongquan/structlog-journald/blob/main/CHANGELOG.md"
Documentation = "https://structlog-journald.readthedocs.io"
Homepage = "https://github.com/hongquan/structlog-journald"
Repository = "https://github.com/hongquan/structlog-journald"

[dependency-groups]
dev = ["pre-commit>=4.5.1", "rich>=15.0.0"]
docs = [
  "myst-parser>=5.0.0",
  "sphinx>=9.1.0",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-book-theme>=1.2.0",
  "sphinxcontrib-asciinema>=0.4.3",
]
lint = ["ruff>=0.15.10"]
test = [
  "pytest>=8.0.0",
  "mypy>=1.20.1",
  "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/structlog_journald/__init__.py"

[tool.mypy]
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = '''(?x)(
^build/
|^dist/
|^.venv/
|^node_modules/
|^migrations/
)
'''
implicit_reexport = false
plugins = []
strict = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 120
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "*/static/CACHE/*",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE001", "ANN"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "single"
